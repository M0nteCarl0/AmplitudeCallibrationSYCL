name: Build and Package Artifacts

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). If specified, publishes a GitHub Release.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  # Current toolkit from oneapi-src/oneapi-ci (update when Intel ships a new kit)
  WINDOWS_TOOLKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe
  WINDOWS_DPCPP_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common

jobs:
  build-windows:
    name: Windows x64 (CMake / icx / Ninja)
    # Pin 2022: VS integration and oneAPI toolsets are reliable here.
    # windows-latest is currently 2025 and often breaks Intel VS integration.
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and install Intel oneAPI DPC++ compiler
        timeout-minutes: 25
        shell: cmd
        run: |
          curl.exe --fail --retry 5 --retry-delay 5 -L --output "%TEMP%\webimage.exe" "%WINDOWS_TOOLKIT_URL%"
          echo Extracting installer...
          "%TEMP%\webimage.exe" -s -x -f webimage_extracted --log extract.log
          if errorlevel 1 exit /b 1
          del "%TEMP%\webimage.exe"
          echo Installing DPC++ component...
          webimage_extracted\bootstrapper.exe -s --action install --components=%WINDOWS_DPCPP_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          if errorlevel 1 exit /b 1
          rd /s /q webimage_extracted

      - name: Configure and Build with CMake
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 vs2022
          if errorlevel 1 (
            call "C:\Program Files\Intel\oneAPI\setvars.bat" intel64 vs2022
          )
          where icx
          where icpx
          cmake -B build -G Ninja ^
            -DCMAKE_C_COMPILER=icx ^
            -DCMAKE_CXX_COMPILER=icx ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=ON ^
            -DBUILD_EXAMPLES=ON
          cmake --build build --config Release

      - name: Stage Artifacts
        shell: pwsh
        run: |
          $stageDir = "artifacts/sycl-imageprocess-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stageDir/bin","$stageDir/lib","$stageDir/include" | Out-Null

          $candidates = @(
            "build/bin",
            "build/Release",
            "build",
            "x64/Release",
            "bin",
            "bin/Release"
          )

          foreach ($root in $candidates) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Include *.dll,*.exe -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName "$stageDir/bin" -Force }
              Get-ChildItem -Path $root -Recurse -Include *.lib,*.exp -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName "$stageDir/lib" -Force }
            }
          }

          if (Test-Path "include/sycl_ip") {
            Copy-Item -Path "include/sycl_ip" -Destination "$stageDir/include" -Recurse -Force
          } elseif (Test-Path "include") {
            Copy-Item -Path "include" -Destination "$stageDir/include" -Recurse -Force
          }

          if (Test-Path "README.md") { Copy-Item README.md $stageDir -Force }
          if (Test-Path "LICENSE")   { Copy-Item LICENSE   $stageDir -Force }

          $binCount = (Get-ChildItem "$stageDir/bin" -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($binCount -eq 0) {
            Write-Error "No binaries were staged. Dumping build tree:"
            Get-ChildItem -Recurse -File build,x64 -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          # 1. Locate Intel oneAPI compiler directory and bundle all SYCL runtime DLLs
          $oneApiBin = ""
          $searchRoots = @(
            "C:\Program Files (x86)\Intel\oneAPI",
            "C:\Program Files\Intel\oneAPI",
            "D:\Program Files (x86)\Intel\oneAPI",
            "D:\Program Files\Intel\oneAPI"
          )

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $found = Get-ChildItem -Path $root -Filter "sycl*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $oneApiBin = $found.DirectoryName
                break
              }
            }
          }

          if (-not $oneApiBin) {
            $icxCmd = Get-Command icx -ErrorAction SilentlyContinue
            if ($icxCmd) {
              $oneApiBin = Split-Path $icxCmd.Source
            }
          }

          Write-Host "Found oneAPI bin directory: $oneApiBin"

          if ($oneApiBin) {
            $dllPatterns = @(
              "sycl*.dll",
              "ur_*.dll",
              "pi_*.dll",
              "libmmd*.dll",
              "svml_dispmd*.dll",
              "libiomp*.dll",
              "libirng*.dll",
              "OpenCL.dll",
              "xptifw.dll",
              "qkmalloc.dll",
              "omptarget*.dll"
            )

            foreach ($pat in $dllPatterns) {
              Get-ChildItem -Path $oneApiBin -Filter $pat -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Copy-Item $_.FullName "$stageDir/bin" -Force
                  Write-Host "Bundled Intel runtime DLL: $($_.Name)"
                }
            }

            # Bundle Intel import libraries for SDK consumers
            $oneApiLib = Join-Path (Split-Path $oneApiBin) "lib"
            if (Test-Path $oneApiLib) {
              Get-ChildItem -Path $oneApiLib -Include sycl*.lib,libmmd*.lib,OpenCL.lib -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Copy-Item $_.FullName "$stageDir/lib" -Force
                  Write-Host "Bundled Intel import LIB: $($_.Name)"
                }
            }
          } else {
            Write-Warning "Intel oneAPI bin directory not found!"
          }

          # 2. Bundle MSVC runtime DLLs
          $msvcDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll",
            "concrt140.dll",
            "vcomp140.dll"
          )

          foreach ($dll in $msvcDlls) {
            $sysPath = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $sysPath) {
              Copy-Item $sysPath "$stageDir/bin" -Force
            }
          }

          # 3. Create run.bat launcher in release root
          $runBat = "@echo off`r`nsetlocal`r`nset `"DIR=%~dp0`"`r`n`"%DIR%bin\AmplitudeCallibrationSYCL.exe`" %*`r`n"
          [IO.File]::WriteAllText((Join-Path (Resolve-Path $stageDir) "run.bat"), $runBat)

          Write-Host "`nStaged files in bin/:"
          Get-ChildItem "$stageDir/bin" | Select-Object Name, Length | Format-Table -AutoSize

          Write-Host "`nVerifying staged standalone binary:"
          & "$stageDir/bin/AmplitudeCallibrationSYCL.exe" --help
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Staged binary execution test failed with exit code $LASTEXITCODE"
            exit 1
          }

          Compress-Archive -Path "$stageDir/*" -DestinationPath "artifacts/sycl-imageprocess-windows-x64.zip" -Force

      - name: Upload Windows Directory Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sycl-imageprocess-windows-x64
          path: artifacts/sycl-imageprocess-windows-x64/
          retention-days: 30

      - name: Upload Windows Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: sycl-imageprocess-windows-x64-zip
          path: artifacts/sycl-imageprocess-windows-x64.zip
          retention-days: 30

      - name: Upload oneAPI install logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-oneapi-install-logs
          path: |
            extract.log
            bootstrapper*
            installer*
          if-no-files-found: ignore
          retention-days: 7

  build-linux:
    name: Linux x64 (CMake / icpx / Ninja)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Intel oneAPI DPC++ compiler
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/oneAPI.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends ninja-build patchelf intel-oneapi-compiler-dpcpp-cpp intel-oneapi-runtime-libs

      - name: Configure and Build with CMake & Ninja
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLES=ON
          cmake --build build --config Release

      - name: Stage Linux Artifacts
        run: |
          STAGE="artifacts/sycl-imageprocess-linux-x64"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/include"

          # 1. Copy built executables and library
          find build -type f \( -name 'AmplitudeCallibrationSYCL' -o -name 'SimpleExample' \) -exec cp {} "$STAGE/bin/" \; || true
          find build -type f \( -name '*.so' -o -name '*.a' \) -exec cp {} "$STAGE/lib/" \; || true

          # 2. Copy headers and docs
          cp -r include/sycl_ip "$STAGE/include/" 2>/dev/null || cp -r include "$STAGE/include/" 2>/dev/null || true
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true

          # 3. Copy Intel oneAPI SYCL and math runtimes from /opt/intel
          for pattern in 'libsycl*.so*' 'libur_*.so*' 'libpi_*.so*' 'libimf.so*' 'libsvml.so*' 'libirng.so*' 'libintlc.so*' 'libiomp5.so*' 'libOpenCL.so*' 'libxpti*.so*'; do
            find /opt/intel -name "$pattern" -exec cp -a -u {} "$STAGE/lib/" \; 2>/dev/null || true
          done

          # 4. Resolve runtime dependencies via ldd
          for bin in "$STAGE/bin"/* "$STAGE/lib"/*.so*; do
            if [ -f "$bin" ]; then
              ldd "$bin" 2>/dev/null | grep '=>' | awk '{print $3}' | grep -v '^$' | while read dep; do
                if [[ "$dep" == /opt/intel/* ]] || [[ "$dep" == *sycl* ]] || [[ "$dep" == *svml* ]] || [[ "$dep" == *imf* ]] || [[ "$dep" == *irng* ]] || [[ "$dep" == *intlc* ]] || [[ "$dep" == *iomp* ]] || [[ "$dep" == *ur_* ]] || [[ "$dep" == *pi_* ]] || [[ "$dep" == *OpenCL* ]]; then
                  cp -a -u "$dep"* "$STAGE/lib/" 2>/dev/null || true
                fi
              done
            fi
          done

          # 5. Set RPATH on all binaries and shared libraries so they locate $STAGE/lib
          for bin in "$STAGE/bin"/*; do
            if [ -f "$bin" ] && [ -x "$bin" ]; then
              patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN' "$bin" 2>/dev/null || true
            fi
          done
          for lib in "$STAGE/lib"/*.so*; do
            if [ -f "$lib" ]; then
              patchelf --set-rpath '$ORIGIN:$ORIGIN/../lib' "$lib" 2>/dev/null || true
            fi
          done

          # 6. Create run.sh launcher script in root
          cat << 'EOF' > "$STAGE/run.sh"
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}"
          if [ $# -eq 0 ]; then
              exec "$DIR/bin/AmplitudeCallibrationSYCL" --help
          else
              exec "$DIR/bin/AmplitudeCallibrationSYCL" "$@"
          fi
          EOF
          chmod +x "$STAGE/run.sh" "$STAGE/bin/"*

          # 7. Test standalone execution
          echo "Verifying staged Linux binary..."
          LD_LIBRARY_PATH="$STAGE/lib" "$STAGE/bin/AmplitudeCallibrationSYCL" --help

          tar -czvf artifacts/sycl-imageprocess-linux-x64.tar.gz -C "$STAGE" .

      - name: Upload Linux Directory Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sycl-imageprocess-linux-x64
          path: artifacts/sycl-imageprocess-linux-x64/
          retention-days: 30

      - name: Upload Linux Tarball Package
        uses: actions/upload-artifact@v4
        with:
          name: sycl-imageprocess-linux-x64-tarball
          path: artifacts/sycl-imageprocess-linux-x64.tar.gz
          retention-days: 30

  build-linux-arm64:
    name: Linux ARM64 (CMake / acpp + CUDA / Ninja)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build patchelf binutils libboost-fiber-dev libboost-context-dev

      - name: Setup Micromamba and install AdaptiveCpp
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sycl-arm64
          # The CUDA-enabled flavour of AdaptiveCpp is required for GPU SYCL on ARM64: the default
          # variant of the conda package only ships the omp (CPU) and ocl (OpenCL) backends.
          # cuda12* is intentional - Jetson Orin (JetPack 6) provides the CUDA 12 driver/runtime.
          # The CUDA dev stack (headers + ptxas) is needed for the ahead-of-time sm_87 build,
          # pinned to 12.9 to match the cuda129 AdaptiveCpp variant. cuda-nvcc-tools is used
          # instead of cuda-nvcc on purpose: the latter pulls the gcc-7 toolchain with binutils
          # 2.36, whose ld cannot read the .relr.dyn sections of the conda sysroot and therefore
          # breaks every link, including the CMake compiler test.
          create-args: >-
            -c conda-forge
            adaptivecpp=*=cuda12*
            cuda-version=12.9
            cuda-nvcc-tools=12.9
            cuda-cudart-dev=12.9
            libcurand-dev=10.3
            cmake
            ninja

      - name: Configure and Build with CMake & Ninja
        shell: bash -el {0}
        run: |
          # "generic" keeps the runtime JIT (portable to any GPU / used for the CPU path), while
          # cuda:sm_87 adds ahead-of-time kernels for Jetson Orin, so that board needs no JIT.
          export ACPP_TARGETS="generic;cuda:sm_87"
          CUDA_INC=""
          for cand in "$CONDA_PREFIX"/targets/*-linux/include "$CONDA_PREFIX"/include; do
            if [ -f "$cand/cuda.h" ]; then
              CUDA_INC="$cand"
              break
            fi
          done
          if [ -z "$CUDA_INC" ]; then
            echo "::error::cuda.h not found in the CUDA dev packages of $CONDA_PREFIX"
            echo "::error::candidates: $(ls -d "$CONDA_PREFIX"/targets/* 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "ACPP_TARGETS=$ACPP_TARGETS"
          echo "CUDA include dir: $CUDA_INC"
          echo "ptxas: $(command -v ptxas || echo MISSING)"

          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=acpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="--acpp-cuda-path=$CONDA_PREFIX -I$CUDA_INC" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$CONDA_PREFIX/lib" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-lcudart" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=ON > /tmp/configure.log 2>&1 || {
              echo "::error::cmake configure failed"
              tail -n 25 /tmp/configure.log | sed 's/^/::error::/'
              exit 1
            }
          cmake --build build --config Release > /tmp/build.log 2>&1 || {
            echo "::error::cmake build failed"
            tail -n 25 /tmp/build.log | sed 's/^/::error::/'
            exit 1
          }
          # The ahead-of-time kernels must be embedded, otherwise the CUDA target silently
          # degraded to the JIT-only "generic" build.
          if ! readelf -SW build/bin/AmplitudeCallibrationSYCL | grep -q nv_fatbin; then
            echo "::error::binary has no CUDA fatbin - the cuda:sm_87 AOT target was not compiled"
            exit 1
          fi
          echo "AOT sm_87 kernels embedded: $(readelf -SW build/bin/AmplitudeCallibrationSYCL | grep -c nv_fatbin) fatbin section(s)"

      - name: Stage Linux ARM64 Artifacts
        shell: bash -el {0}
        run: |
          STAGE="artifacts/sycl-imageprocess-linux-arm64"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/include"

          # 1. Copy built executables and library
          find build -type f \( -name 'AmplitudeCallibrationSYCL' -o -name 'SimpleExample' \) -exec cp {} "$STAGE/bin/" \; || true
          find build -type f \( -name '*.so' -o -name '*.a' \) -exec cp {} "$STAGE/lib/" \; || true

          # 2. Copy headers and docs
          cp -r include/sycl_ip "$STAGE/include/" 2>/dev/null || cp -r include "$STAGE/include/" 2>/dev/null || true
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true

          # 3. Copy AdaptiveCpp runtime, backend plugins, JIT bitcode and Boost/libstdc++ runtimes.
          #    Symlinks are dereferenced (-L) so the package never points back into the toolchain.
          CONDA_LIB="$MAMBA_ROOT_PREFIX/envs/sycl-arm64/lib"
          for pattern in 'libacpp*' 'librt-backend*' 'libllvm-to-*' 'libcudart.so*' 'libboost_context*' 'libboost_fiber*' 'libstdc++.so*' 'libgcc_s.so*'; do
            find "$CONDA_LIB" -maxdepth 1 -name "$pattern" -exec cp -aL {} "$STAGE/lib/" \; 2>/dev/null || true
          done
          for boostdir in "$CONDA_LIB" "/usr/lib/aarch64-linux-gnu"; do
            if [ -d "$boostdir" ]; then
              find "$boostdir" -maxdepth 1 \( -name 'libboost_context*.so*' -o -name 'libboost_fiber*.so*' \) -exec cp -aL {} "$STAGE/lib/" \; 2>/dev/null || true
            fi
          done
          for plugindir in "$CONDA_LIB/hipSYCL" "$CONDA_LIB/AdaptiveCpp"; do
            if [ -d "$plugindir" ]; then
              mkdir -p "$STAGE/lib/hipSYCL"
              cp -aL "$plugindir"/* "$STAGE/lib/hipSYCL/" 2>/dev/null || true
            fi
          done

          # 3b. LLVM tools for AdaptiveCpp's runtime JIT. The runtime resolves opt/llc relative to
          #     libacpp-common.so, i.e. as $BUNDLE/lib/hipSYCL/ext/llvm/bin/<tool>, and otherwise
          #     falls back to the (non-relocatable) path of the build machine. Without them the
          #     generic target fails at runtime with "LLVMToPtx: opt invocation failed".
          CONDA_BIN="$MAMBA_ROOT_PREFIX/envs/sycl-arm64/bin"
          LLVM_TOOL_BIN="$STAGE/lib/hipSYCL/ext/llvm/bin"
          mkdir -p "$LLVM_TOOL_BIN"
          for pattern in 'opt' 'opt-[0-9]*' 'llc' 'llc-[0-9]*' 'lld' 'lld-[0-9]*' 'ld.lld' 'ld.lld-[0-9]*'; do
            find "$CONDA_BIN" -maxdepth 1 -name "$pattern" -exec cp -aL {} "$LLVM_TOOL_BIN/" \; 2>/dev/null || true
          done
          if ! ls "$LLVM_TOOL_BIN"/opt* >/dev/null 2>&1; then
            echo "::error::AdaptiveCpp's JIT tools (opt/llc) were not found in $CONDA_BIN"
            echo "        install the 'llvm-tools' package into the SYCL environment"
            exit 1
          fi
          echo "Staged JIT tools: $(ls "$LLVM_TOOL_BIN" | tr '\n' ' ')"

          # 4. Stage every runtime library the packaged objects need and the toolchain provides.
          #    ldd is deliberately not used: on the runner the system LLVM is visible, so a missing
          #    bundled copy silently resolves to /usr/lib and the published package then fails on a
          #    clean machine ("No CPU backend has been loaded. Terminating."). NEEDED entries are
          #    therefore resolved against the conda prefix explicitly, while GPU driver libraries
          #    of the target machine are never staged.
          EXTERNAL_LIBS="libcuda.so.1 libnvidia-ml.so.1 libamdhip64.so.6 libhiprtc.so.6 libOpenCL.so.1"
          if ! command -v readelf >/dev/null 2>&1; then
            echo "::error::readelf is required to analyse the package dependencies"
            exit 1
          fi
          needed_of() {
            readelf -d "$1" 2>/dev/null | sed -n 's/.*(NEEDED).*\[\(.*\)\].*/\1/p'
          }
          staged_elfs() {
            find "$STAGE/bin" "$STAGE/lib" -type f \( -name '*.so*' -o -perm -u+x \) 2>/dev/null
          }
          in_bundle() {
            [ -e "$STAGE/lib/$1" ] || [ -e "$STAGE/lib/hipSYCL/$1" ] \
              || [ -e "$STAGE/lib/hipSYCL/llvm-to-backend/$1" ]
          }
          is_external() {
            echo " $EXTERNAL_LIBS " | grep -q " $1 "
          }
          for pass in 1 2 3 4 5 6 7 8; do
            added=0
            while IFS= read -r elf; do
              for soname in $(needed_of "$elf"); do
                if in_bundle "$soname" || is_external "$soname"; then
                  continue
                fi
                src=$(find "$CONDA_LIB" -maxdepth 1 -name "$soname" | head -n 1)
                if [ -n "$src" ]; then
                  cp -aL "$src" "$STAGE/lib/" || true
                  echo "  [deps] staged $soname (needed by $(basename "$elf"))"
                  added=$((added + 1))
                fi
              done
            done < <(staged_elfs)
            if [ "$added" -eq 0 ]; then
              break
            fi
          done

          # 5. Give every staged binary package-relative RPATHs. Overwriting them with a single
          #    directory broke plugin -> libllvm-to-*.so lookup, so the paths cover every lib level.
          #    This applies to the LLVM JIT tools as well (executables in ext/llvm/bin).
          RPATH_LIB='$ORIGIN:$ORIGIN/..:$ORIGIN/../..:$ORIGIN/../../..:$ORIGIN/../../../..:$ORIGIN/llvm-to-backend:$ORIGIN/../llvm-to-backend:$ORIGIN/../../llvm-to-backend'
          RPATH_BIN='$ORIGIN/../lib:$ORIGIN/../lib/hipSYCL:$ORIGIN/../lib/hipSYCL/llvm-to-backend:$ORIGIN'
          for bin in "$STAGE/bin"/*; do
            if [ -f "$bin" ]; then
              patchelf --set-rpath "$RPATH_BIN" "$bin" || true
            fi
          done
          while IFS= read -r -d '' elf; do
            # Only real ELF objects: patchelf chokes on linker scripts such as conda's libstdc++.so
            if head -c 4 "$elf" | grep -q ELF; then
              patchelf --set-rpath "$RPATH_LIB" "$elf" || true
            fi
          done < <(find "$STAGE/lib" -type f \( -name '*.so*' -o -perm -u+x \) -print0)

          # 6. Create run.sh launcher script in root
          cat << 'EOF' > "$STAGE/run.sh"
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$DIR/lib/hipSYCL:${LD_LIBRARY_PATH:-}"
          export ACPP_RT_PLUGIN_DIR="$DIR/lib/hipSYCL"
          export HIPSYCL_RT_PLUGIN_DIR="$DIR/lib/hipSYCL"
          if [ $# -eq 0 ]; then
              exec "$DIR/bin/AmplitudeCallibrationSYCL" --help
          else
              exec "$DIR/bin/AmplitudeCallibrationSYCL" "$@"
          fi
          EOF
          chmod +x "$STAGE/run.sh" "$STAGE/bin/"*

          # 7. Verify: every NEEDED library is bundled, provided by the GPU driver, or is a system
          #    library the toolchain cannot supply (glibc, dynamic loader).
          failures=0
          while IFS= read -r elf; do
            for soname in $(needed_of "$elf"); do
              if in_bundle "$soname" || is_external "$soname"; then
                continue
              fi
              if [ -z "$(find "$CONDA_LIB" -maxdepth 1 -name "$soname" | head -n 1)" ]; then
                continue
              fi
              echo "MISSING: $(basename "$elf") -> $soname"
              failures=$((failures + 1))
            done
          done < <(staged_elfs)
          if [ "$failures" -ne 0 ]; then
            echo "::error::ARM64 package is missing runtime libraries (see MISSING lines above)"
            exit 1
          fi
          echo "Staged backends: $(cd "$STAGE/lib/hipSYCL" && ls librt-backend-*.so | tr '\n' ' ')"
          echo "Driver libraries expected on the target machine: $EXTERNAL_LIBS"

          # 8. Test standalone execution with an environment stripped of the toolchain. The
          #    toolchain's own LLVM tools are hidden for the duration of the test: after the
          #    relocation performed here, the baked build-machine path no longer exists on a user
          #    machine, so the bundle must use its own copies from lib/hipSYCL/ext/llvm/bin. This
          #    is what makes the test fail for a package that only works on the build host.
          echo "Verifying staged ARM64 Linux binary..."
          hidden=""
          for tool in "$CONDA_BIN"/opt "$CONDA_BIN"/opt-[0-9]* "$CONDA_BIN"/llc "$CONDA_BIN"/llc-[0-9]*; do
            if [ -e "$tool" ]; then
              mv "$tool" "$tool.hidden"
              hidden="$hidden $tool"
            fi
          done
          set +e
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$STAGE/run.sh" --help
          help_status=$?
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$STAGE/run.sh" --test --device cpu
          test_status=$?
          set -e
          for tool in $hidden; do
            mv "$tool.hidden" "$tool"
          done
          if [ "$help_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "::error::staged ARM64 package does not run standalone (help=$help_status, tests=$test_status)"
            exit 1
          fi

          tar -czvf artifacts/sycl-imageprocess-linux-arm64.tar.gz -C "$STAGE" .

      - name: Upload Linux ARM64 Directory Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sycl-imageprocess-linux-arm64
          path: artifacts/sycl-imageprocess-linux-arm64/
          retention-days: 30

      - name: Upload Linux ARM64 Tarball Package
        uses: actions/upload-artifact@v4
        with:
          name: sycl-imageprocess-linux-arm64-tarball
          path: artifacts/sycl-imageprocess-linux-arm64.tar.gz
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Zip Package
        uses: actions/download-artifact@v4
        with:
          name: sycl-imageprocess-windows-x64-zip
          path: release-assets-win

      - name: Download Linux Tarball Package
        uses: actions/download-artifact@v4
        with:
          name: sycl-imageprocess-linux-x64-tarball
          path: release-assets-linux

      - name: Download Linux ARM64 Tarball Package
        uses: actions/download-artifact@v4
        with:
          name: sycl-imageprocess-linux-arm64-tarball
          path: release-assets-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Release ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets-win/sycl-imageprocess-windows-x64.zip
            release-assets-linux/sycl-imageprocess-linux-x64.tar.gz
            release-assets-linux-arm64/sycl-imageprocess-linux-arm64.tar.gz
          overwrite: true
          draft: false
          prerelease: false
          generate_release_notes: true